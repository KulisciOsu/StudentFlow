name: StudentFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  backend:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API
        run: dotnet build src/StudentFlow.Api/StudentFlow.Api.csproj -c Release
      - name: Run tests
        run: |
          dotnet test tests/StudentFlow.Core.Tests/StudentFlow.Core.Tests.csproj -c Release --logger trx --results-directory TestResults/core
          dotnet test tests/StudentFlow.Api.Tests/StudentFlow.Api.Tests.csproj -c Release --logger trx --results-directory TestResults/api
          dotnet test tests/StudentFlow.Data.Tests/StudentFlow.Data.Tests.csproj -c Release --logger trx --results-directory TestResults/data
      - name: Upload backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7

  database:
    name: PostgreSQL 17 Migrations & Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studentflow
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: studentflow-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studentflow -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      STUDENTFLOW_TEST_DATABASE: Host=127.0.0.1;Port=5432;Database=postgres;Username=studentflow;Password=studentflow-ci-only;SSL Mode=Disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test migrations and account store against PostgreSQL
        run: |
          dotnet test tests/StudentFlow.Data.IntegrationTests/StudentFlow.Data.IntegrationTests.csproj -c Release --logger trx --results-directory TestResults/database
          dotnet test tests/StudentFlow.Api.IntegrationTests/StudentFlow.Api.IntegrationTests.csproj -c Release --logger trx --results-directory TestResults/http
      - name: Upload database results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-results
          path: |
            TestResults/database/
            TestResults/http/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend Build, Lint & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/studentflow.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/studentflow.client/package-lock.json
      - run: npm ci
      - name: Audit production and development dependencies
        run: npm run audit:dependencies
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e-tests:
    name: HTTPS Application & API
    needs: [backend, database, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Prohlížeče i systémové knihovny jsou hotové; CI nemusí opakovaně instalovat balíčky přes apt.
      # Při aktualizaci Playwrightu změňte současně tento tag a package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Chromium potřebuje dostatek sdílené paměti i při běhu uvnitř job kontejneru.
      options: --ipc=host
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studentflow
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: studentflow-ci-only
        # Job a PostgreSQL sdílejí Docker síť; službu není potřeba publikovat na hostiteli.
        options: >-
          --health-cmd "pg_isready -U studentflow -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      # Uvnitř job kontejneru je databáze dostupná pod názvem služby, nikoliv přes localhost.
      STUDENTFLOW_E2E_DATABASE_URL: postgresql://studentflow:studentflow-ci-only@postgres:5432/postgres
    defaults:
      run:
        working-directory: src/studentflow.client
        # Kontejner má jinak jako výchozí shell sh; kroky zachovávají Bash používaný na runneru.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Nástroje aplikace mají vlastní verze nezávislé na Node.js předinstalovaném v image.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/studentflow.client/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Verify Playwright image version
        # Metadata pocházejí ze skutečně spuštěného oficiálního image, nikoliv z druhé kopie čísla verze.
        # Nesoulad odhalíme před startem API a testů s jasným návodem na aktualizaci tagu.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const image = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          const installed = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version;
          if (image.driverVersion !== installed) {
            throw new Error(`Playwright image ${image.driverVersion} does not match installed package ${installed}. Update the container image tag together with package-lock.json.`);
          }
          console.log(`Playwright ${installed}: container image and installed package match.`);
          NODE
      - name: Prepare HTTPS and local configuration
        run: node ../../scripts/dev.mjs setup
      - name: Restore API
        run: dotnet restore ../StudentFlow.Api/StudentFlow.Api.csproj
      # Použije prohlížeče z image; API, Vite a testy běží společně přes vývojové HTTPS.
      - name: Test against real API through Vite proxy
        run: npm run test:e2e
      - name: Upload browser reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            src/studentflow.client/playwright-report/
            src/studentflow.client/test-results/
          if-no-files-found: warn
          retention-days: 7
