services:
  postgres:
    image: postgres:17
    container_name: studentflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: studentflow
      POSTGRES_USER: studentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: