<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="1050"
     viewBox="0 0 800 1050">

  <rect width="800" height="1050" fill="#f5f6f8"/>

  <!-- Hlavička -->
  <rect x="20" y="20" width="760" height="70"
        rx="12" fill="white" stroke="#cbd5e1"/>

  <text x="40" y="65" font-family="Arial"
        font-size="26" font-weight="bold">StudentFlow</text>

  <text x="650" y="65" font-family="Arial"
        font-size="18">Uživatel</text>

  <!-- Uvítání -->
  <text x="30" y="140" font-family="Arial"
        font-size="25" font-weight="bold">
    Vítej zpět, Jane!
  </text>

  <!-- Statistiky -->
  <g fill="white" stroke="#cbd5e1">
    <rect x="30" y="180" width="230" height="120" rx="12"/>
    <rect x="285" y="180" width="230" height="120" rx="12"/>
    <rect x="540" y="180" width="230" height="120" rx="12"/>
  </g>

  <g font-family="Arial" font-size="18">
    <text x="50" y="220">Moje projekty</text>
    <text x="305" y="220">Moje úkoly</text>
    <text x="560" y="220">Blízké termíny</text>
  </g>

  <g font-family="Arial" font-size="34" font-weight="bold">
    <text x="50" y="275">3</text>
    <text x="305" y="275">8</text>
    <text x="560" y="275">2</text>
  </g>

  <!-- Projekty -->
  <rect x="30" y="340" width="740" height="300"
        rx="12" fill="white" stroke="#cbd5e1"/>

  <g font-family="Arial">
    <text x="50" y="385" font-size="24" font-weight="bold">
      Moje projekty
    </text>
    <text x="50" y="450" font-size="19">Informační systém</text>
    <text x="50" y="515" font-size="19">Webová aplikace</text>
    <text x="50" y="580" font-size="19">Databázový projekt</text>
  </g>

  <!-- Termíny -->
  <rect x="30" y="680" width="740" height="280"
        rx="12" fill="white" stroke="#cbd5e1"/>

  <g font-family="Arial">
    <text x="50" y="725" font-size="24" font-weight="bold">
      Nejbližší termíny
    </text>
    <text x="50" y="790" font-size="19">
      Dokončení API – 10. 11.
    </text>
    <text x="50" y="850" font-size="19">
      Prezentace – 12. 11.
    </text>
  </g>

</svg>