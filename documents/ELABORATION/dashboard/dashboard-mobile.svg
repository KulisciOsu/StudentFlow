<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1600" viewBox="0 0 390 1600">
  <style>
    text { font-family: Arial, sans-serif; fill: #242424; }
    .heading { font-size: 24px; font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .normal { font-size: 13px; }
    .small { font-size: 11px; fill: #666; }
    .card { fill: #fff; stroke: #ccc; }
    .dark { fill: #292929; }
    .button-text { fill: #fff; font-weight: bold; }
    .danger { fill: #c62828; }
    .avatar { fill: #e5e5e5; }
    .avatar-text { font-size: 10px; text-anchor: middle; }
    .project-button-text { fill: #fff; font-size: 11px; font-weight: bold; text-anchor: middle; }
    a { cursor: pointer; }
  </style>

  <rect width="390" height="1600" fill="#f7f7f7"/>
  <rect width="390" height="65" fill="#fff"/>

  <!-- Logo StudentFlow – návrat na dashboard -->
  <a href="#dashboard">
    <g transform="translate(15 20) scale(0.85)">
      <path d="M0 9 L20 0 L40 9 L20 18 Z" fill="#292929"/>
      <path d="M8 15 V23 Q20 33 32 23 V15" fill="none" stroke="#292929" stroke-width="3"/>
    </g>
    <text x="60.05" y="37.849999999999994" font-size="17.85" font-weight="bold">StudentFlow</text>
  </a>

  <!-- Zvonek oznámení -->
  <g transform="translate(250 21)">
    <path d="M5 17 Q5 2 16 2 Q27 2 27 17 L31 23 H1 Z" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="16" cy="26" r="3" fill="#333"/>
    <circle cx="30" cy="2" r="10" fill="#333"/>
    <text x="30" y="6" font-size="11" class="button-text" text-anchor="middle">3</text>
  </g>

  <!-- Mobilní profil – bez šipky -->
  <circle cx="350" cy="32" r="18" fill="#f0f0f0" stroke="#ccc"/>
  <text x="350" y="36" font-size="11" text-anchor="middle">PS</text>

  <text x="20" y="105" class="heading">Moje projekty</text>

  <text x="20" y="125" class="small">Projekty, ve kterých jste členem týmu.</text>

  <rect x="20" y="145" width="350" height="43" rx="7" class="dark"/>

  <text x="195" y="172" font-size="14" text-anchor="middle" class="button-text">+ Založit projekt</text>

  <!-- PROJEKT 1 – celý panel je placeholder odkaz -->
  <a href="#detail-projektu-rezervacni-system">
    <rect x="20" y="210" width="350" height="250" rx="10" class="card"/>
    <text x="35" y="239" class="title">Rezervační systém knihovny</text>
    <text x="35" y="261" class="small">Tým Sova · 5 členů</text>
    <rect x="35" y="277" width="70" height="24" rx="12" class="dark"/>
    <text x="70" y="293" font-size="11" text-anchor="middle" class="button-text">Vedoucí</text>
    <text x="35" y="326" class="normal">3 z 10 úkolů hotovo</text>
    <rect x="35" y="340" width="315" height="8" rx="4" fill="#ddd"/>
    <rect x="35" y="340" width="94" height="8" rx="4" fill="#333"/>
    <text x="35" y="375" class="normal">Moje úkoly: 1 otevřený</text>
    <text x="35" y="398" class="small">Nejbližší milník: Inception, 31. 10.</text>
    <g>
      <circle cx="47" cy="427" r="15" class="avatar"/>
      <circle cx="84" cy="427" r="15" class="avatar"/>
      <circle cx="121" cy="427" r="15" class="avatar"/>
      <circle cx="158" cy="427" r="15" class="avatar"/>
      <circle cx="195" cy="427" r="15" class="avatar"/>
      <g class="avatar-text">
        <text x="47" y="431">PS</text>
        <text x="84" y="431">JN</text>
        <text x="121" y="431">TD</text>
        <text x="158" y="431">LČ</text>
        <text x="195" y="431">MK</text>
      </g>
    </g>
    <!-- Výrazné tlačítko – zástupný odkaz na detail projektu -->
    <rect x="214" y="408" width="142" height="34" rx="6" class="dark"/>
    <text x="285" y="429" class="project-button-text">Zobrazit projekt →</text>
  </a>

  <!-- PROJEKT 2 – celý panel je placeholder odkaz -->
  <a href="#detail-projektu-analyza-dat">
    <rect x="20" y="480" width="350" height="250" rx="10" class="card"/>
    <text x="35" y="509" class="title">Analýza dat: semestrální práce</text>
    <text x="35" y="531" class="small">Tým Delta · 4 členové</text>
    <rect x="35" y="547" width="55" height="24" rx="12" fill="#eee" stroke="#aaa"/>
    <text x="62.5" y="563" font-size="11" text-anchor="middle" >Člen</text>
    <text x="35" y="596" class="normal">5 z 8 úkolů hotovo</text>
    <rect x="35" y="610" width="315" height="8" rx="4" fill="#ddd"/>
    <rect x="35" y="610" width="197" height="8" rx="4" fill="#333"/>
    <text x="35" y="645" class="normal">Moje úkoly: 2 otevřené · 1 po termínu</text>
    <text x="35" y="668" class="small">Nejbližší milník: Odevzdání, 12. 12.</text>
    <g>
      <circle cx="47" cy="697" r="15" class="avatar"/>
      <circle cx="84" cy="697" r="15" class="avatar"/>
      <circle cx="121" cy="697" r="15" class="avatar"/>
      <circle cx="158" cy="697" r="15" class="avatar"/>
      <g class="avatar-text">
        <text x="47" y="701">KB</text>
        <text x="84" y="701">PS</text>
        <text x="121" y="701">OV</text>
        <text x="158" y="701">RH</text>
      </g>
    </g>
    <!-- Výrazné tlačítko – zástupný odkaz na detail projektu -->
    <rect x="214" y="678" width="142" height="34" rx="6" class="dark"/>
    <text x="285" y="699" class="project-button-text">Zobrazit projekt →</text>
  </a>

  <!-- Založení nového projektu – placeholder -->
  <a href="#zalozit-projekt">
    <rect x="20" y="750" width="350" height="115" rx="10" fill="none" stroke="#aaa" stroke-dasharray="6 5"/>
    <text x="195" y="789.5" font-size="32" text-anchor="middle">+</text>
    <text x="195" y="822.5" class="title" text-anchor="middle">Založit nový projekt</text>
    <text x="195" y="846.5" class="small" text-anchor="middle">Stanete se vedoucím jeho týmu.</text>
  </a>

  <text x="20" y="910" class="heading">Moje úkoly</text>

  <text x="20" y="929" class="small">Napříč všemi projekty</text>

  <!-- Návrh přepínače Otevřené / Hotové -->
  <rect x="20" y="950" width="350" height="43" rx="6" fill="#eee"/>
  <rect x="25" y="955" width="199" height="33" rx="5" class="dark"/>
  <text x="124.5" y="977" font-size="12" text-anchor="middle" class="button-text">Otevřené (3)</text>
  <text x="296" y="977" class="normal" text-anchor="middle">Hotové</text>

  <!-- Ukázkový úkol -->
  <rect x="20" y="1010" width="350" height="130" rx="10" class="card"/>
  <text x="35" y="1040" class="title">Čištění datasetu</text>
  <text x="35" y="1060" class="small">Analýza dat</text>
  <text x="35" y="1085" class="danger normal">24. 10. – po termínu</text>
  <text x="35" y="1112" class="small">Priorita: Vysoká · Rozpracováno</text>

  <!-- Ukázkový úkol -->
  <rect x="20" y="1160" width="350" height="130" rx="10" class="card"/>
  <text x="35" y="1190" class="title">Wireframy obrazovek</text>
  <text x="35" y="1210" class="small">Rezervační systém knihovny</text>
  <text x="35" y="1235" class="normal">Termín: 30. 10.</text>
  <text x="35" y="1262" class="small">Priorita: Střední · Rozpracováno</text>

  <!-- Ukázkový úkol -->
  <rect x="20" y="1310" width="350" height="130" rx="10" class="card"/>
  <text x="35" y="1340" class="title">Regresní model</text>
  <text x="35" y="1360" class="small">Analýza dat</text>
  <text x="35" y="1385" class="normal">Termín: 6. 11.</text>
  <text x="35" y="1412" class="small">Priorita: Střední · K řešení</text>

  <!-- Samostatné připomenutí termínu -->
  <rect x="20" y="1460" width="350" height="110" rx="10" class="card"/>
  <circle cx="45" cy="1487" r="14" fill="#f0f0f0" stroke="#aaa"/>
  <text x="45" y="1492" font-size="17" text-anchor="middle">!</text>
  <text x="70" y="1492" font-size="14" font-weight="bold">Připomenutí termínu</text>
  <text x="35" y="1520" class="normal">Regresní model</text>
  <text x="35" y="1542" class="small">Termín: 6. 11. · Projekt: Analýza dat</text>
</svg>
