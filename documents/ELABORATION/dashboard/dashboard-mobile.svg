<svg xmlns="http://www.w3.org/2000/svg"
     width="390" height="950"
     viewBox="0 0 390 950">

  <rect width="390" height="950" fill="#f5f6f8"/>

  <!-- Hlavička -->
  <rect x="12" y="12" width="366" height="60"
        rx="10" fill="white" stroke="#cbd5e1"/>
  <text x="25" y="49" font-family="Arial"
        font-size="22" font-weight="bold">StudentFlow</text>
  <text x="305" y="48" font-family="Arial"
        font-size="14">Profil</text>

  <!-- Uvítání -->
  <text x="16" y="110" font-family="Arial"
        font-size="22" font-weight="bold">
    Vítej zpět, Jane!
  </text>

  <!-- Statistiky -->
  <g fill="white" stroke="#cbd5e1">
    <rect x="16" y="135" width="358" height="78" rx="10"/>
    <rect x="16" y="225" width="358" height="78" rx="10"/>
    <rect x="16" y="315" width="358" height="78" rx="10"/>
  </g>

  <g font-family="Arial" font-size="18">
    <text x="30" y="165">Moje projekty</text>
    <text x="30" y="255">Moje úkoly</text>
    <text x="30" y="345">Blízké termíny</text>
  </g>

  <g font-family="Arial" font-size="27" font-weight="bold">
    <text x="30" y="197">3</text>
    <text x="30" y="287">8</text>
    <text x="30" y="377">2</text>
  </g>

  <!-- Projekty -->
  <rect x="16" y="415" width="358" height="245"
        rx="10" fill="white" stroke="#cbd5e1"/>

  <g font-family="Arial">
    <text x="30" y="450" font-size="21" font-weight="bold">
      Moje projekty
    </text>
    <text x="30" y="505" font-size="16">Informační systém</text>
    <text x="30" y="560" font-size="16">Webová aplikace</text>
    <text x="30" y="615" font-size="16">Databázový projekt</text>
  </g>

  <!-- Termíny -->
  <rect x="16" y="680" width="358" height="225"
        rx="10" fill="white" stroke="#cbd5e1"/>

  <g font-family="Arial">
    <text x="30" y="720" font-size="21" font-weight="bold">
      Nejbližší termíny
    </text>
    <text x="30" y="780" font-size="16">
      Dokončení API – 10. 11.
    </text>
    <text x="30" y="835" font-size="16">
      Prezentace – 12. 11.
    </text>
  </g>

</svg>