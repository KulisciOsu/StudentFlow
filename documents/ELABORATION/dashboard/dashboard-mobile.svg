
<svg xmlns="http://www.w3.org/2000/svg"
     width="390" height="1500"
     viewBox="0 0 390 1500">

  <style>
    text { font-family: Arial, sans-serif; fill: #242424; }
    .heading { font-size: 21px; font-weight: bold; }
    .title { font-size: 15px; font-weight: bold; }
    .normal { font-size: 13px; }
    .small { font-size: 11px; fill: #666; }
    .card { fill: white; stroke: #ccc; }
    .dark { fill: #292929; }
    .button-text { fill: #fff; font-weight: bold; }
    .danger { fill: #c62828; }
  </style>

  <rect width="390" height="1500" fill="#f7f7f7"/>

  <!-- HLAVIČKA -->
  <rect width="390" height="65" fill="white"/>

  <!-- Logo -->
  <path d="M15 28 L32 20 L49 28 L32 36 Z"
        fill="#292929"/>
  <path d="M22 34 V40 Q32 48 42 40 V34"
        stroke="#292929" stroke-width="2"
        fill="none"/>

  <text x="59" y="39" font-size="19"
        font-weight="bold">StudentFlow</text>

  <!-- Oznámení -->
  <path d="M255 36 Q255 23 265 23
           Q275 23 275 36 L279 42 H251 Z"
        fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="278" cy="22" r="9" fill="#333"/>
  <text x="278" y="26" font-size="10"
        text-anchor="middle" class="button-text">3</text>

  <!-- Profil -->  
  <circle cx="350" cy="32" r="18" fill="#f0f0f0" stroke="#ccc"/>
  <text x="350" y="36" font-size="11" text-anchor="middle">PS</text>

  <!-- PROJEKTY -->
  <text x="20" y="105" class="heading">Moje projekty</text>
  <text x="20" y="125" class="small">
    Projekty, ve kterých jste členem týmu.
  </text>

  <!-- Založení projektu -->
  <rect x="20" y="145" width="350" height="43"
        rx="7" class="dark"/>
  <text x="195" y="172" font-size="14"
        text-anchor="middle" class="button-text">
    + Založit projekt
  </text>

  <!-- PROJEKT 1 -->
  <rect x="20" y="210" width="350" height="250"
        rx="10" class="card"/>

  <text x="35" y="239" class="title">
    Rezervační systém knihovny
  </text>
  <text x="35" y="261" class="small">
    Tým Sova · 5 členů
  </text>

  <rect x="35" y="277" width="70" height="23"
        rx="12" class="dark"/>
  <text x="70" y="293" font-size="11"
        text-anchor="middle" class="button-text">
    Vedoucí
  </text>

  <text x="35" y="326" class="normal">
    3 z 10 úkolů hotovo
  </text>

  <rect x="35" y="340" width="315" height="7"
        rx="4" fill="#ddd"/>
  <rect x="35" y="340" width="95" height="7"
        rx="4" fill="#333"/>

  <text x="35" y="375" class="normal">
    Moje úkoly: 1 otevřený
  </text>
  <text x="35" y="398" class="small">
    Milník: Inception, 31. 10.
  </text>
  <!-- Členové týmu -->
  <g>
    <circle cx="47" cy="427" r="15" fill="#e5e5e5"/>
    <circle cx="84" cy="427" r="15" fill="#e5e5e5"/>
    <circle cx="121" cy="427" r="15" fill="#e5e5e5"/>
    <circle cx="158" cy="427" r="15" fill="#e5e5e5"/>
    <circle cx="195" cy="427" r="15" fill="#e5e5e5"/>

    <g font-size="10" text-anchor="middle">
      <text x="47" y="431">PS</text>
      <text x="84" y="431">JN</text>
      <text x="121" y="431">TD</text>
      <text x="158" y="431">LČ</text>
      <text x="195" y="431">MK</text>
    </g>
  </g>

  <!-- PROJEKT 2 -->
  <rect x="20" y="480" width="350" height="250"
        rx="10" class="card"/>

  <text x="35" y="509" class="title">
    Analýza dat: semestrální práce
  </text>
  <text x="35" y="531" class="small">
    Tým Delta · 4 členové
  </text>

  <rect x="35" y="547" width="55" height="23"
        rx="12" fill="#eee" stroke="#aaa"/>
  <text x="62" y="563" font-size="11"
        text-anchor="middle">Člen</text>

  <text x="35" y="596" class="normal">
    5 z 8 úkolů hotovo
  </text>

  <rect x="35" y="610" width="315" height="7"
        rx="4" fill="#ddd"/>
  <rect x="35" y="610" width="197" height="7"
        rx="4" fill="#333"/>

  <text x="35" y="645" class="normal">
    Moje úkoly: 2 otevřené
  </text>
  <text x="35" y="668" class="small">
    Milník: Odevzdání, 12. 12.
  </text>
  <!-- Členové týmu -->
  <g>
    <circle cx="47" cy="697" r="15" fill="#e5e5e5"/>
    <circle cx="84" cy="697" r="15" fill="#e5e5e5"/>
    <circle cx="121" cy="697" r="15" fill="#e5e5e5"/>
    <circle cx="158" cy="697" r="15" fill="#e5e5e5"/>

    <g font-size="10" text-anchor="middle">
      <text x="47" y="701">KB</text>
      <text x="84" y="701">PS</text>
      <text x="121" y="701">OV</text>
      <text x="158" y="701">RH</text>
    </g>
  </g>

  <!-- Nový projekt -->
  <rect x="20" y="750" width="350" height="115"
        rx="10" fill="none" stroke="#aaa"
        stroke-dasharray="6 5"/>

  <text x="195" y="790" font-size="29"
        text-anchor="middle">+</text>
  <text x="195" y="818" class="title"
        text-anchor="middle">
    Založit nový projekt
  </text>
  <text x="195" y="840" class="small"
        text-anchor="middle">
    Stanete se vedoucím jeho týmu.
  </text>

  <!-- ÚKOLY -->
  <text x="20" y="910" class="heading">
    Moje úkoly
  </text>
  <text x="20" y="929" class="small">
    Napříč všemi projekty
  </text>

  <!-- Přepínač -->
  <rect x="20" y="950" width="350" height="43"
        rx="7" fill="#eee"/>
  <rect x="25" y="955" width="175" height="33"
        rx="5" class="dark"/>
  <text x="112" y="977" font-size="13"
        text-anchor="middle" class="button-text">
    Otevřené (3)
  </text>
  <text x="285" y="977" font-size="13"
        text-anchor="middle">Hotové</text>

  <!-- ÚKOL 1 -->
  <rect x="20" y="1010" width="350" height="130"
        rx="10" class="card"/>
  <text x="35" y="1040" class="title">
    Čištění datasetu
  </text>
  <text x="35" y="1060" class="small">
    Analýza dat
  </text>
  <text x="35" y="1085" class="danger normal">
    24. 10. – po termínu
  </text>
  <text x="35" y="1112" class="small">
    Priorita: Vysoká · Rozpracováno
  </text>

  <!-- ÚKOL 2 -->
  <rect x="20" y="1160" width="350" height="130"
        rx="10" class="card"/>
  <text x="35" y="1190" class="title">
    Wireframy obrazovek
  </text>
  <text x="35" y="1210" class="small">
    Rezervační systém knihovny
  </text>
  <text x="35" y="1235" class="normal">
    Termín: 30. 10.
  </text>
  <text x="35" y="1262" class="small">
    Priorita: Střední · Rozpracováno
  </text>

  <!-- ÚKOL 3 -->
  <rect x="20" y="1310" width="350" height="130"
        rx="10" class="card"/>
  <text x="35" y="1340" class="title">
    Regresní model
  </text>
  <text x="35" y="1360" class="small">
    Analýza dat
  </text>
  <text x="35" y="1385" class="normal">
    Termín: 6. 11.
  </text>
  <text x="35" y="1412" class="small">
    Priorita: Střední · K řešení
  </text>

</svg>
