<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
  <style>
    text { font-family: Arial, sans-serif; fill: #242424; }
    .heading { font-size: 24px; font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .normal { font-size: 13px; }
    .small { font-size: 11px; fill: #666; }
    .card { fill: #fff; stroke: #ccc; }
    .dark { fill: #292929; }
    .button-text { fill: #fff; font-weight: bold; }
    .danger { fill: #c62828; }
    .avatar { fill: #e5e5e5; }
    .avatar-text { font-size: 10px; text-anchor: middle; }
    .project-button-text { fill: #fff; font-size: 11px; font-weight: bold; text-anchor: middle; }
    a { cursor: pointer; }
  </style>

  <rect width="1280" height="860" fill="#f7f7f7"/>
  <rect width="1280" height="70" fill="#fff"/>

  <!-- Logo StudentFlow – návrat na dashboard -->
  <a href="#dashboard">
    <g transform="translate(35 22) scale(1)">
      <path d="M0 9 L20 0 L40 9 L20 18 Z" fill="#292929"/>
      <path d="M8 15 V23 Q20 33 32 23 V15" fill="none" stroke="#292929" stroke-width="3"/>
    </g>
    <text x="88" y="43" font-size="21" font-weight="bold">StudentFlow</text>
  </a>

  <!-- Zvonek oznámení -->
  <g transform="translate(995 20)">
    <path d="M5 17 Q5 2 16 2 Q27 2 27 17 L31 23 H1 Z" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="16" cy="26" r="3" fill="#333"/>
    <circle cx="30" cy="2" r="10" fill="#333"/>
    <text x="30" y="6" font-size="11" class="button-text" text-anchor="middle">3</text>
  </g>

  <!-- Uživatelský profil -->
  <g>
    <rect x="1060" y="14" width="195" height="43" rx="22" class="card"/>
    <circle cx="1085" cy="35" r="15" fill="#eee"/>
    <text x="1085" y="39" font-size="12" text-anchor="middle">PS</text>
    <text x="1108" y="32" class="normal">Petra Svobodová</text>
    <text x="1108" y="47" class="small">Student</text>
    <path d="M1233 32 l5 5 l5 -5" stroke="#333" stroke-width="1.5" fill="none"/>
  </g>

  <text x="50" y="115" class="heading">Moje projekty</text>

  <text x="50" y="140" class="small">Projekty, ve kterých jste členem nebo vedoucím týmu.</text>

  <rect x="1050" y="94" width="180" height="43" rx="6" class="dark"/>

  <text x="1140" y="121" font-size="14" text-anchor="middle" class="button-text">+ Založit projekt</text>

  <!-- PROJEKT 1 – celý panel je placeholder odkaz -->
  <a href="#detail-projektu-rezervacni-system">
    <rect x="50" y="175" width="370" height="265" rx="10" class="card"/>
    <text x="70" y="205" class="title">Rezervační systém knihovny</text>
    <text x="70" y="227" class="small">Tým Sova · 5 členů</text>
    <rect x="70" y="239" width="70" height="24" rx="12" class="dark"/>
    <text x="105" y="255" font-size="11" text-anchor="middle" class="button-text">Vedoucí</text>
    <text x="70" y="284" class="normal">3 z 10 úkolů hotovo</text>
    <rect x="70" y="299" width="325" height="8" rx="4" fill="#ddd"/>
    <rect x="70" y="299" width="98" height="8" rx="4" fill="#333"/>
    <text x="70" y="335" class="normal">Moje úkoly: 1 otevřený</text>
    <text x="70" y="363" class="small">Nejbližší milník: Inception, 31. 10.</text>
    <g>
      <circle cx="82" cy="401" r="15" class="avatar"/>
      <circle cx="119" cy="401" r="15" class="avatar"/>
      <circle cx="156" cy="401" r="15" class="avatar"/>
      <circle cx="193" cy="401" r="15" class="avatar"/>
      <circle cx="230" cy="401" r="15" class="avatar"/>
      <g class="avatar-text">
        <text x="82" y="405">PS</text>
        <text x="119" y="405">JN</text>
        <text x="156" y="405">TD</text>
        <text x="193" y="405">LČ</text>
        <text x="230" y="405">MK</text>
      </g>
    </g>
    <!-- Výrazné tlačítko – zástupný odkaz na detail projektu -->
    <rect x="265" y="393" width="140" height="32" rx="6" class="dark"/>
    <text x="335" y="413" class="project-button-text">Zobrazit projekt →</text>
  </a>

  <!-- PROJEKT 2 – celý panel je placeholder odkaz -->
  <a href="#detail-projektu-analyza-dat">
    <rect x="440" y="175" width="370" height="265" rx="10" class="card"/>
    <text x="460" y="205" class="title">Analýza dat: semestrální práce</text>
    <text x="460" y="227" class="small">Tým Delta · 4 členové</text>
    <rect x="460" y="239" width="55" height="24" rx="12" fill="#eee" stroke="#aaa"/>
    <text x="487.5" y="255" font-size="11" text-anchor="middle" >Člen</text>
    <text x="460" y="284" class="normal">5 z 8 úkolů hotovo</text>
    <rect x="460" y="299" width="325" height="8" rx="4" fill="#ddd"/>
    <rect x="460" y="299" width="203" height="8" rx="4" fill="#333"/>
    <text x="460" y="335" class="normal">Moje úkoly: 2 otevřené · 1 po termínu</text>
    <text x="460" y="363" class="small">Nejbližší milník: Odevzdání, 12. 12.</text>
    <g>
      <circle cx="472" cy="401" r="15" class="avatar"/>
      <circle cx="509" cy="401" r="15" class="avatar"/>
      <circle cx="546" cy="401" r="15" class="avatar"/>
      <circle cx="583" cy="401" r="15" class="avatar"/>
      <g class="avatar-text">
        <text x="472" y="405">KB</text>
        <text x="509" y="405">PS</text>
        <text x="546" y="405">OV</text>
        <text x="583" y="405">RH</text>
      </g>
    </g>
    <!-- Výrazné tlačítko – zástupný odkaz na detail projektu -->
    <rect x="655" y="393" width="140" height="32" rx="6" class="dark"/>
    <text x="725" y="413" class="project-button-text">Zobrazit projekt →</text>
  </a>

  <!-- Založení nového projektu – placeholder -->
  <a href="#zalozit-projekt">
    <rect x="830" y="175" width="400" height="265" rx="10" fill="none" stroke="#aaa" stroke-dasharray="6 5"/>
    <text x="1030" y="289.5" font-size="32" text-anchor="middle">+</text>
    <text x="1030" y="322.5" class="title" text-anchor="middle">Založit nový projekt</text>
    <text x="1030" y="346.5" class="small" text-anchor="middle">Stanete se vedoucím jeho týmu.</text>
  </a>

  <text x="50" y="505" class="heading">Moje úkoly napříč projekty</text>

  <!-- Návrh přepínače Otevřené / Hotové -->
  <rect x="1020" y="475" width="210" height="43" rx="6" fill="#eee"/>
  <rect x="1025" y="480" width="119" height="33" rx="5" class="dark"/>
  <text x="1084.5" y="502" font-size="12" text-anchor="middle" class="button-text">Otevřené (3)</text>
  <text x="1185" y="502" class="normal" text-anchor="middle">Hotové</text>

  <!-- Tabulka otevřených úkolů -->
  <rect x="50" y="540" width="1180" height="210" rx="8" class="card"/>
  <rect x="51" y="541" width="1178" height="42" rx="7" fill="#eee"/>
  <g class="normal">
    <text x="70" y="568">Úkol</text>
    <text x="365" y="568">Projekt</text>
    <text x="735" y="568">Termín</text>
    <text x="925" y="568">Priorita</text>
    <text x="1090" y="568">Stav</text>
  </g>
  <path d="M50 583 H1230 M50 638 H1230 M50 694 H1230" stroke="#ddd"/>
  <g font-size="13">
    <text x="70" y="616">Čištění datasetu</text>
    <text x="365" y="616">Analýza dat</text>
    <text x="735" y="616" class="danger">24. 10. – po termínu</text>
    <text x="925" y="616">Vysoká</text>
    <text x="1090" y="616">Rozpracováno</text>
    <text x="70" y="672">Wireframy obrazovek</text>
    <text x="365" y="672">Rezervační systém knihovny</text>
    <text x="735" y="672">30. 10.</text>
    <text x="925" y="672">Střední</text>
    <text x="1090" y="672">Rozpracováno</text>
    <text x="70" y="728">Regresní model</text>
    <text x="365" y="728">Analýza dat</text>
    <text x="735" y="728">6. 11.</text>
    <text x="925" y="728">Střední</text>
    <text x="1090" y="728">K řešení</text>
  </g>

  <!-- Samostatné připomenutí termínu -->
  <rect x="50" y="775" width="1180" height="55" rx="8" class="card"/>
  <circle cx="80" cy="802" r="14" fill="#f0f0f0" stroke="#aaa"/>
  <text x="80" y="807" font-size="17" text-anchor="middle">!</text>
  <text x="110" y="797" font-size="13" font-weight="bold">Připomenutí termínu</text>
  <text x="110" y="816" class="small">Regresní model – termín 6. 11. – projekt Analýza dat</text>
</svg>
