
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="850"
     viewBox="0 0 1200 850">

  <rect width="1200" height="850" fill="#f5f6f8"/>

  <!-- Hlavička -->
  <rect x="20" y="20" width="1160" height="80"
        rx="12" fill="white" stroke="#d0d5dd"/>

  <text x="50" y="68" font-family="Arial"
        font-size="28" font-weight="bold">
    StudentFlow
  </text>

  <text x="1030" y="68" font-family="Arial"
        font-size="20">Uživatel</text>

  <!-- Uvítání -->
  <text x="40" y="155" font-family="Arial"
        font-size="26" font-weight="bold">
    Vítej zpět, Jane!
  </text>

  <!-- Statistiky -->
  <g fill="white" stroke="#cbd5e1">
    <rect x="40" y="190" width="350" height="130" rx="12"/>
    <rect x="425" y="190" width="350" height="130" rx="12"/>
    <rect x="810" y="190" width="350" height="130" rx="12"/>
  </g>

  <g font-family="Arial" font-size="22" fill="#222">
    <text x="65" y="235">Moje projekty</text>
    <text x="450" y="235">Moje úkoly</text>
    <text x="835" y="235">Blízké termíny</text>
  </g>

  <g font-family="Arial" font-size="36" font-weight="bold">
    <text x="65" y="290">3</text>
    <text x="450" y="290">8</text>
    <text x="835" y="290">2</text>
  </g>

  <!-- Hlavní obsah -->
  <g fill="white" stroke="#cbd5e1">
    <rect x="40" y="370" width="550" height="400" rx="12"/>
    <rect x="610" y="370" width="550" height="400" rx="12"/>
  </g>

  <g font-family="Arial" font-size="24" font-weight="bold">
    <text x="65" y="415">Moje projekty</text>
    <text x="635" y="415">Nejbližší termíny</text>
  </g>

  <g font-family="Arial" font-size="19">
    <text x="65" y="480">Informační systém</text>
    <text x="65" y="540">Webová aplikace</text>
    <text x="65" y="600">Databázový projekt</text>

    <text x="635" y="480">Dokončení API – 10. 11.</text>
    <text x="635" y="540">Prezentace – 12. 11.</text>
  </g>

</svg>
