
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="860" viewBox="0 0 1280 860">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: #242424;
    }
    .heading { font-size: 24px; font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .normal { font-size: 13px; }
    .small { font-size: 11px; fill: #666; }
    .card { fill: white; stroke: #ccc; }
    .dark { fill: #292929; }
    .button-text {
      fill: #ffffff;
      font-weight: bold;
    }
    .danger { fill: #c62828; }
    .muted { fill: #666; }
  </style>

  <rect width="1280" height="860" fill="#f7f7f7"/>

  <!-- HLAVIČKA -->
  <rect width="1280" height="70" fill="white"/>

  <!-- Logo StudentFlow -->
  <g>
    <path d="M35 31 L55 22 L75 31 L55 40 Z"
          fill="#292929"/>
    <path d="M43 37 V45 Q55 55 67 45 V37"
          stroke="#292929" stroke-width="3"
          fill="none"/>
    <text x="88" y="43" font-size="21"
          font-weight="bold">StudentFlow</text>
  </g>

  <!-- Oznámení -->
  <g>
    <path d="M1000 37 Q1000 22 1011 22
             Q1022 22 1022 37 L1026 43
             H996 Z"
          fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="1011" cy="46" r="3" fill="#333"/>
    <circle cx="1025" cy="22" r="10" fill="#333"/>
    <text x="1025" y="26" font-size="11"
          text-anchor="middle" class="button-text">3</text>
  </g>

  <!-- Uživatelský profil -->
  <rect x="1060" y="14" width="195" height="43"
        rx="22" class="card"/>
  <circle cx="1085" cy="35" r="15" fill="#eee"/>
  <text x="1085" y="39" font-size="12"
        text-anchor="middle">PS</text>
  <text x="1108" y="32" class="normal">Petra Svobodová</text>
  <text x="1108" y="47" class="small">Student</text>
  <text x="1235" y="39">⌄</text>

  <!-- PROJEKTY -->
  <text x="50" y="115" class="heading">Moje projekty</text>
  <text x="50" y="140" class="small">
    Projekty, ve kterých jste členem nebo vedoucím týmu.
  </text>

  <!-- Tlačítko založení projektu -->
  <rect x="1050" y="94" width="180" height="43"
        rx="6" class="dark"/>
  <text x="1140" y="121" font-size="14"
        text-anchor="middle" class="button-text">
    + Založit projekt
  </text>

  <!-- PROJEKT 1 -->
  <rect x="50" y="175" width="370" height="265"
        rx="10" class="card"/>

  <text x="70" y="205" class="title">
    Rezervační systém knihovny
  </text>
  <text x="70" y="227" class="small">
    Tým Sova · 5 členů
  </text>

  <!-- Vedoucí -->
  <rect x="333" y="239" width="68" height="25"
        rx="12" class="dark"/>
  <text x="367" y="256" font-size="11"
        text-anchor="middle" class="button-text">
    Vedoucí
  </text>

  <text x="70" y="284" class="normal">
    3 z 10 úkolů hotovo
  </text>

  <rect x="70" y="299" width="325" height="8"
        rx="4" fill="#ddd"/>
  <rect x="70" y="299" width="98" height="8"
        rx="4" fill="#333"/>

  <text x="70" y="335" class="normal">
    Moje úkoly: 1 otevřený
  </text>
  <text x="70" y="363" class="small">
    Nejbližší milník: Inception, 31. 10.
  </text>

  <!-- Členové týmu -->
  <g>
    <circle cx="82" cy="401" r="15" fill="#e5e5e5"/>
    <circle cx="119" cy="401" r="15" fill="#e5e5e5"/>
    <circle cx="156" cy="401" r="15" fill="#e5e5e5"/>
    <circle cx="193" cy="401" r="15" fill="#e5e5e5"/>
    <circle cx="230" cy="401" r="15" fill="#e5e5e5"/>
    <g font-size="10" text-anchor="middle">
      <text x="82" y="405">PS</text>
      <text x="119" y="405">JN</text>
      <text x="156" y="405">TD</text>
      <text x="193" y="405">LČ</text>
      <text x="230" y="405">MK</text>
    </g>
  </g>

  <!-- PROJEKT 2 -->
  <rect x="440" y="175" width="370" height="265"
        rx="10" class="card"/>

  <text x="460" y="205" class="title">
    Analýza dat: semestrální práce
  </text>
  <text x="460" y="227" class="small">
    Tým Delta · 4 členové
  </text>

  <rect x="740" y="239" width="50" height="25"
        rx="12" fill="#eee" stroke="#aaa"/>
  <text x="765" y="256" font-size="11"
        text-anchor="middle">Člen</text>

  <text x="460" y="284" class="normal">
    5 z 8 úkolů hotovo
  </text>

  <rect x="460" y="299" width="325" height="8"
        rx="4" fill="#ddd"/>
  <rect x="460" y="299" width="203" height="8"
        rx="4" fill="#333"/>

  <text x="460" y="335" class="normal">
    Moje úkoly: 2 otevřené
  </text>
  <text x="460" y="363" class="small">
    Nejbližší milník: Odevzdání, 12. 12.
  </text>

  <g>
    <circle cx="472" cy="401" r="15" fill="#e5e5e5"/>
    <circle cx="509" cy="401" r="15" fill="#e5e5e5"/>
    <circle cx="546" cy="401" r="15" fill="#e5e5e5"/>
    <circle cx="583" cy="401" r="15" fill="#e5e5e5"/>
    <g font-size="10" text-anchor="middle">
      <text x="472" y="405">KB</text>
      <text x="509" y="405">PS</text>
      <text x="546" y="405">OV</text>
      <text x="583" y="405">RH</text>
    </g>
  </g>

  <!-- ZALOŽENÍ NOVÉHO PROJEKTU -->
  <rect x="830" y="175" width="400" height="265"
        rx="10" fill="none" stroke="#aaa"
        stroke-dasharray="6 5"/>

  <text x="1030" y="285" font-size="38"
        text-anchor="middle">+</text>
  <text x="1030" y="326" class="title"
        text-anchor="middle">
    Založit nový projekt
  </text>
  <text x="1030" y="350" class="small"
        text-anchor="middle">
    Stanete se vedoucím jeho týmu.
  </text>

  <!-- ÚKOLY -->
  <text x="50" y="505" class="heading">
    Moje úkoly napříč projekty
  </text>

  <!-- Přepínač otevřené/hotové -->
  <rect x="1020" y="475" width="210" height="43"
        rx="6" fill="#eee"/>
  <rect x="1025" y="480" width="120" height="33"
        rx="5" class="dark"/>

  <text x="1085" y="502" font-size="12"
        text-anchor="middle" class="button-text">
    Otevřené (3)
  </text>
  <text x="1180" y="502" class="normal"
        text-anchor="middle">Hotové</text>

  <!-- TABULKA -->
  <rect x="50" y="540" width="1180" height="210"
        rx="8" class="card"/>
  <rect x="51" y="541" width="1178" height="42"
        rx="7" fill="#eee"/>

  <g class="normal">
    <text x="70" y="568">Úkol</text>
    <text x="365" y="568">Projekt</text>
    <text x="735" y="568">Termín</text>
    <text x="925" y="568">Priorita</text>
    <text x="1090" y="568">Stav</text>
  </g>

  <path d="M50 583 H1230 M50 638 H1230 M50 694 H1230"
        stroke="#ddd"/>

  <g class="normal">
    <text x="70" y="616">Čištění datasetu</text>
    <text x="365" y="616">Analýza dat</text>
    <text x="735" y="616" class="danger">
      24. 10. – po termínu
    </text>
    <text x="925" y="616">Vysoká</text>
    <text x="1090" y="616">Rozpracováno</text>

    <text x="70" y="672">Wireframy obrazovek</text>
    <text x="365" y="672">Rezervační systém knihovny</text>
    <text x="735" y="672">30. 10.</text>
    <text x="925" y="672">Střední</text>
    <text x="1090" y="672">Rozpracováno</text>

    <text x="70" y="728">Regresní model</text>
    <text x="365" y="728">Analýza dat</text>
    <text x="735" y="728">6. 11.</text>
    <text x="925" y="728">Střední</text>
    <text x="1090" y="728">K řešení</text>
  </g>

</svg>
