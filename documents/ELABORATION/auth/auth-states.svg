<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Doplněk původního Wireframe.pdf – stavy a odhlášení</title>
<desc id="desc">Doplněk původních wireframů: odhlášení a podrobné stavy autentizace při úspěchu, validaci, expiraci a výpadku sítě.</desc>
<rect x="0" y="0" width="1440" height="1080" rx="0" fill="#fff" stroke="none"/>
<text x="40" y="44" font-family="sans-serif" fill="#262626" font-size="25" font-weight="bold">Doplněk 02 / Odhlášení a stavy autentizace</text>
<text x="40" y="72" font-family="sans-serif" fill="#666" font-size="14" font-weight="normal">Doplněk Wireframe.pdf; hlavička ukazuje ovládání autentizace, níže jsou samostatné ukázky stavů.</text>
<rect x="40" y="106" width="1360" height="90" rx="0" fill="#fff" stroke="#b5b5b5"/>
<rect x="64" y="134" width="30" height="30" rx="4" fill="#fff" stroke="#b5b5b5"/>
<text x="70" y="155" font-family="sans-serif" fill="#262626" font-size="12" font-weight="bold">SF</text>
<text x="106" y="156" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">StudentFlow</text>
<rect x="400" y="129" width="190" height="44" rx="6" fill="#fff" stroke="#292929"/>
<text x="495.0" y="157" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#262626">Moje projekty</text>
<text x="650" y="155" font-family="sans-serif" fill="#262626" font-size="15" font-weight="normal">Člen</text>
<text x="1038" y="151" font-family="sans-serif" fill="#262626" font-size="15" font-weight="bold">Jan Novák</text>
<rect x="1210" y="129" width="166" height="44" rx="6" fill="#fff" stroke="#292929"/>
<text x="1293.0" y="157" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#262626">Odhlásit se</text>
<text x="64" y="228" font-family="sans-serif" fill="#666" font-size="14" font-weight="normal">Člen → Moje projekty; vyučující → Přehled projektů. Účet má právě jeden typ, bez přepínání.</text>
<rect x="40" y="270" width="660" height="160" rx="6" fill="#f8f8f8" stroke="#b5b5b5"/>
<text x="60" y="300" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">Účet byl vytvořen</text>
<text x="60" y="328" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Nyní se přihlaste. E-mail je předvyplněný,</text>
<text x="60" y="349" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">heslo zadáte znovu.</text>
<rect x="60" y="368" width="300" height="44" rx="6" fill="#fff" stroke="#292929"/>
<text x="210.0" y="396" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#262626">Přejít na přihlášení</text>
<rect x="740" y="270" width="660" height="160" rx="6" fill="#f8f8f8" stroke="#b5b5b5"/>
<text x="760" y="300" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">Přihlášení se nezdařilo</text>
<text x="760" y="328" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">E-mail nebo heslo nejsou správné.</text>
<text x="760" y="349" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Zpráva nerozlišuje existenci ani aktivitu účtu.</text>
<rect x="760" y="368" width="300" height="44" rx="6" fill="#fff" stroke="#292929"/>
<text x="910.0" y="396" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#262626">Znovu se přihlásit</text>
<rect x="40" y="450" width="660" height="160" rx="6" fill="#f8f8f8" stroke="#b5b5b5"/>
<text x="60" y="480" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">Přihlášení již neplatí</text>
<text x="60" y="508" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Přihlaste se znovu. Soukromá data jsou skrytá.</text>
<text x="60" y="529" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Čtení ani aktivita platnost session neprodlužují.</text>
<rect x="60" y="548" width="300" height="44" rx="6" fill="#fff" stroke="#292929"/>
<text x="210.0" y="576" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#262626">Přihlásit se</text>
<rect x="740" y="450" width="660" height="160" rx="6" fill="#f8f8f8" stroke="#b5b5b5"/>
<text x="760" y="480" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">Přihlášení se nepodařilo ověřit</text>
<text x="760" y="508" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Zkontrolujte připojení a zkuste to znovu.</text>
<text x="760" y="529" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Chyba spojení se nevydává za odhlášení.</text>
<rect x="760" y="548" width="300" height="44" rx="6" fill="#fff" stroke="#292929"/>
<text x="910.0" y="576" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#262626">Zkusit znovu</text>
<rect x="40" y="630" width="660" height="160" rx="6" fill="#f8f8f8" stroke="#b5b5b5"/>
<text x="60" y="660" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">Odhlášení se nepodařilo potvrdit</text>
<text x="60" y="688" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Soukromý obsah zůstává skrytý.</text>
<text x="60" y="709" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Serverové odhlášení je nutné dokončit.</text>
<rect x="60" y="728" width="300" height="44" rx="6" fill="#fff" stroke="#292929"/>
<text x="210.0" y="756" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#262626">Zkusit odhlášení znovu</text>
<rect x="740" y="630" width="660" height="160" rx="6" fill="#f8f8f8" stroke="#b5b5b5"/>
<text x="760" y="660" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">Opravte označená pole</text>
<text x="760" y="688" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Hesla se neshodují.</text>
<text x="760" y="709" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Vyberte typ účtu: Člen, nebo Vyučující.</text>
<rect x="760" y="728" width="300" height="44" rx="6" fill="#fff" stroke="#292929"/>
<text x="910.0" y="756" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#262626">Přejít k první chybě</text>
<rect x="40" y="810" width="660" height="160" rx="6" fill="#f8f8f8" stroke="#b5b5b5"/>
<text x="60" y="840" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">Příliš mnoho pokusů</text>
<text x="60" y="868" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Zkuste to znovu za 60 sekund.</text>
<text x="60" y="889" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Po čekání požadavek odešle až uživatel.</text>
<rect x="740" y="810" width="660" height="160" rx="6" fill="#f8f8f8" stroke="#b5b5b5"/>
<text x="760" y="840" font-family="sans-serif" fill="#262626" font-size="17" font-weight="bold">Ověřujeme přihlášení…</text>
<text x="760" y="868" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Načítání identity po startu nebo refreshi.</text>
<text x="760" y="889" font-family="sans-serif" fill="#666" font-size="13" font-weight="normal">Chráněný obsah se zobrazí až po ověření.</text>
<text x="40" y="1056" font-family="sans-serif" fill="#666" font-size="12" font-weight="normal">Doplněk Wireframe.pdf · KAN-101 / KAN-102 · 4. 11. 2026 · ukázková data</text>
</svg>
