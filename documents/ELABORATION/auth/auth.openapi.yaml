openapi: 3.1.1
info:
  title: StudentFlow Authentication API
  version: 0.4.0
  description: >-
    KAN-114: schválený kontrakt. Implementované jsou všechny uvedené endpointy. Sémantická pravidla
    v API_CONTRACT.md jsou součástí kontraktu. Frontend a API používají stejný
    origin. Registrace nevytváří přihlášení. Všechny odpovědi mají no-store.
servers:
  - url: /
tags:
  - name: Authentication
    description: Registrace, identita a serverové session.
paths:
  /api/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Načíst CSRF token pro aktuální identitu
      description: >-
        Nastaví podpůrnou HttpOnly antiforgery cookie. Request token drží klient
        pouze v paměti; po změně identity jej musí znovu načíst.
      security: []
      responses:
        '200':
          description: Token a název hlavičky; platí společně s antiforgery cookie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: Podpůrná cookie; bez Domain, Expires a Max-Age.
              schema:
                type: string
              example: __Host-StudentFlow.Csrf=opaque-token; Path=/; Secure; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
              example:
                token: opaque-request-token
                headerName: X-CSRF-TOKEN
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Vytvořit účet bez automatického přihlášení
      description: >-
        Ořízne jméno a e-mail, e-mail převede na malá písmena, pak validuje délky.
        Heslo se nemění. Účet a právě jeden typ vzniknou v jediné transakci.
        accountType je STUDENT (Člen), nebo TEACHER (Vyučující); kombinace a pole
        se odmítnou. Neznámá pole se odmítnou. Úspěch nenastavuje autentizační cookie.
        JSON má limit 16 KiB. Výchozí limit je 20 požadavků za 60 minut na IP
        v pevném okně jedné instance; lze jej změnit konfigurací.
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              displayName: Jan Novák
              email: jan.novak@example.test
              password: moje-dlouhe-heslo-2026
              accountType: STUDENT
      responses:
        '201':
          description: Účet založen; klient přejde na přihlášení.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                user:
                  id: '42'
                  displayName: Jan Novák
                  email: jan.novak@example.test
                  accountType: STUDENT
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Ověřit údaje a vytvořit novou serverovou session
      description: >-
        Špatné heslo, neexistující i neaktivní účet mají stejnou odpověď 401.
        Session platí absolutně 8 hodin, s rememberMe 30 dní. Bez prodlužování.
        Případnou platnou session předloženou stejnou cookie nahradí a zneplatní;
        ostatní zařízení neodhlašuje. Před dalším zápisem klient načte nový CSRF token.
        JSON má limit 16 KiB. Výchozí omezení je 30 požadavků za 15 minut na IP.
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: jan.novak@example.test
              password: moje-dlouhe-heslo-2026
              rememberMe: false
      responses:
        '200':
          description: Identita, pevná expirace session a autentizační cookie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: >-
                Bez Domain. Bez rememberMe chybí Expires/Max-Age; s rememberMe
                odpovídající Expires a Max-Age=2592000. Cookie obsahuje pouze token.
              schema:
                type: string
              example: __Host-StudentFlow.Session=opaque-session-token; Path=/; Secure; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
              example:
                user:
                  id: '42'
                  displayName: Jan Novák
                  email: jan.novak@example.test
                  accountType: TEACHER
                session:
                  expiresAt: '2026-11-02T20:00:00Z'
                  persistent: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Ověřit aktuální session a vrátit identitu
      description: >-
        Ověřuje aktivitu účtu i existenci, expiraci a nezneplatnění session na
        serveru. Platnost neprodlužuje. Chybějící, expirovaná nebo zneplatněná
        session vrací stejné 401, nikoli přesměrování na HTML.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Ověřená identita pro frontend a dashboard KAN-47.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Zneplatnit aktuální session a odstranit cookie
      description: >-
        Bez těla požadavku i odpovědi. Po validaci CSRF vrací 204 i pro chybějící
        nebo již neplatnou session. Zneplatnění na serveru musí předcházet
        odpovědi. Při nedostupnosti úložiště vrátí 503. Klient poté zahodí CSRF
        token i privátní data; při nejistém výsledku nehlásí úspěšné odhlášení.
      security:
        - csrfHeader: []
          csrfCookie: []
      responses:
        '204':
          description: Aktuální session již nedovoluje přístup, cookie odstraněna.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: Odstranění cookie stejným názvem, cestou a příznaky.
              schema:
                type: string
              example: __Host-StudentFlow.Session=; Path=/; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Secure; HttpOnly; SameSite=Lax
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-StudentFlow.Session
      description: Secure, HttpOnly, SameSite=Lax, Path=/, bez Domain.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Request token z GET /api/auth/csrf, vázaný na aktuální identitu.
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Host-StudentFlow.Csrf
      description: Podpůrná HttpOnly cookie; samotná hlavička bez této cookie nestačí.
  headers:
    NoStore:
      description: Povinné pro všechny odpovědi včetně chyb.
      required: true
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Počet sekund do dalšího povoleného pokusu.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 60
  schemas:
    AccountType:
      type: string
      enum: [STUDENT, TEACHER]
      description: Právě jeden typ účtu. STUDENT se v rozhraní zobrazuje jako Člen.
    DisplayName:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '\S'
      description: Po oříznutí; neunikátní zobrazované jméno.
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 320
      description: Oříznutý e-mail převedený na malá písmena.
    Password:
      type: string
      minLength: 15
      maxLength: 128
      writeOnly: true
      description: Unicode code pointy; bez ořezání a normalizace.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password, accountType]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        accountType:
          $ref: '#/components/schemas/AccountType'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        rememberMe:
          type: boolean
          default: false
    User:
      type: object
      additionalProperties: false
      required: [id, displayName, email, accountType]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: PostgreSQL BIGINT jako řetězec, ne JavaScript number.
        displayName:
          $ref: '#/components/schemas/DisplayName'
        email:
          $ref: '#/components/schemas/Email'
        accountType:
          $ref: '#/components/schemas/AccountType'
          description: >-
            Právě STUDENT nebo TEACHER, bez projektových oprávnění. Účet s žádným
            nebo oběma typy je nekonzistentní: API nevydá identitu a vrátí 500 INTERNAL_ERROR.
    Session:
      type: object
      additionalProperties: false
      required: [expiresAt, persistent]
      properties:
        expiresAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: Pevná expirace UTC; čtení ani aktivita ji neprodlužuje.
        persistent:
          type: boolean
          description: True odpovídá rememberMe a třicetidenní platnosti.
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    IdentityResponse:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, traceId]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - CSRF_INVALID
            - EMAIL_ALREADY_REGISTERED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        traceId:
          type: string
          minLength: 1
        errors:
          type: object
          description: Volitelné chyby pod camelCase názvy polí, bez citlivých hodnot.
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
  responses:
    BadRequest:
      description: 400 VALIDATION_FAILED, včetně neplatného JSON, typů a neznámých polí.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Neplatné vstupní údaje
            status: 400
            detail: Opravte označená pole.
            code: VALIDATION_FAILED
            traceId: request-correlation-id
            errors:
              password: [Heslo musí mít 15 až 128 znaků.]
    InvalidCredentials:
      description: 401 INVALID_CREDENTIALS; shodné pro špatné heslo a neexistující/neaktivní účet.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Přihlášení se nezdařilo
            status: 401
            detail: E-mail nebo heslo nejsou správné.
            code: INVALID_CREDENTIALS
            traceId: request-correlation-id
    Unauthenticated:
      description: 401 UNAUTHENTICATED, bez rozlišení důvodu neplatnosti session.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Je nutné přihlášení
            status: 401
            detail: Přihlaste se znovu.
            code: UNAUTHENTICATED
            traceId: request-correlation-id
    CsrfInvalid:
      description: 403 CSRF_INVALID; odmítnutí před změnou dat, token obnovit nejvýše jednou.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Ověření požadavku se nezdařilo
            status: 403
            detail: Obnovte ověření a zkuste to znovu.
            code: CSRF_INVALID
            traceId: request-correlation-id
    EmailAlreadyRegistered:
      description: 409 EMAIL_ALREADY_REGISTERED, včetně souběžné registrace stejného e-mailu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Účet již existuje
            status: 409
            detail: Účet s tímto e-mailem už existuje. Přihlaste se.
            code: EMAIL_ALREADY_REGISTERED
            traceId: request-correlation-id
            errors:
              email: [Účet s tímto e-mailem už existuje.]
    PayloadTooLarge:
      description: 413 PAYLOAD_TOO_LARGE; JSON registrace nebo loginu přesahuje 16 KiB.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: 415 UNSUPPORTED_MEDIA_TYPE; registrace a login vyžadují application/json.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 429 RATE_LIMITED; opakování až po čekání a akci uživatele.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Příliš mnoho pokusů
            status: 429
            detail: Zkuste to znovu později.
            code: RATE_LIMITED
            traceId: request-correlation-id
    InternalError:
      description: 500 INTERNAL_ERROR, bez technických detailů a citlivých dat.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 503 SERVICE_UNAVAILABLE; výsledek zápisu může být neznámý, neopakovat automaticky.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
